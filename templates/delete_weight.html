<!DOCTYPE html>
<html>
<head>
    <title>Delete Weight</title>
</head>
<body>

<h2>Delete Weight</h2>

<p>Are you sure you want to delete this weight?</p>

<p><strong>{{ weight.weight }} kg</strong></p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

</form>

<br>

<a href="{% url 'view_weight' %}">
    Cancel
</a>

</body>
</html>
